name: Quality

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/rust-test.yml@main
    with:
      clippy-args: "--lib --bins"
      run-fmt: false
      run-coverage: false
      runner: ubuntu-latest
